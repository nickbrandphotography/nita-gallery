<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Sample living room. Scale: 3.2 px = 1 cm (the wall shown is 500 cm wide, 262 cm to the top edge). Floor line at y=840. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efebe4"/>
      <stop offset="0.55" stop-color="#e7e2d9"/>
      <stop offset="1" stop-color="#d9d3c8"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88a66"/>
      <stop offset="1" stop-color="#8b6d4c"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc8bc"/>
      <stop offset="1" stop-color="#b8b0a2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#wall)"/>
  <rect width="1600" height="840" fill="url(#light)"/>
  <rect y="828" width="1600" height="12" fill="#f4f1ea"/>
  <rect y="840" width="1600" height="160" fill="url(#floor)"/>
  <g stroke="#7a5e40" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="880" x2="1600" y2="880"/><line x1="0" y1="930" x2="1600" y2="930"/><line x1="0" y1="985" x2="1600" y2="985"/>
  </g>
  <!-- rug -->
  <ellipse cx="800" cy="935" rx="620" ry="48" fill="#d8d0c2" opacity="0.85"/>
  <!-- sofa: 275 cm wide -->
  <ellipse cx="800" cy="842" rx="470" ry="14" fill="#000" opacity="0.18"/>
  <rect x="360" y="512" width="880" height="190" rx="34" fill="url(#sofa)"/>
  <rect x="340" y="640" width="920" height="170" rx="30" fill="#c4bcaf"/>
  <rect x="330" y="600" width="90" height="220" rx="36" fill="#bdb5a7"/>
  <rect x="1180" y="600" width="90" height="220" rx="36" fill="#bdb5a7"/>
  <rect x="430" y="630" width="360" height="70" rx="24" fill="#cdc6ba"/>
  <rect x="810" y="630" width="360" height="70" rx="24" fill="#cdc6ba"/>
  <rect x="380" y="815" width="18" height="25" fill="#5b4632"/><rect x="1202" y="815" width="18" height="25" fill="#5b4632"/>
  <rect x="460" y="560" width="120" height="95" rx="18" fill="#e9e4da" transform="rotate(-8 520 607)"/>
  <rect x="1030" y="560" width="120" height="95" rx="18" fill="#8f8a80" transform="rotate(7 1090 607)"/>
  <!-- plant -->
  <path d="M150 840 L130 720 L250 720 L230 840 Z" fill="#cbbfae"/>
  <g fill="#6f7d5c">
    <ellipse cx="190" cy="600" rx="34" ry="110" transform="rotate(-25 190 600)"/>
    <ellipse cx="215" cy="590" rx="30" ry="120" transform="rotate(18 215 590)"/>
    <ellipse cx="175" cy="640" rx="26" ry="90" transform="rotate(-55 175 640)"/>
    <ellipse cx="240" cy="650" rx="24" ry="80" transform="rotate(50 240 650)"/>
  </g>
  <!-- floor lamp -->
  <rect x="1408" y="430" width="6" height="410" fill="#2b2b2b"/>
  <ellipse cx="1411" cy="840" rx="40" ry="8" fill="#2b2b2b"/>
  <path d="M1360 430 L1462 430 L1440 360 L1382 360 Z" fill="#efe6d3"/>
</svg>
