<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Sample office / reception. Scale: 3.2 px = 1 cm (the wall shown is 500 cm wide, 262 cm to the top edge). Floor line at y=840. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cdc6"/>
      <stop offset="0.5" stop-color="#d4d7d0"/>
      <stop offset="1" stop-color="#c3c7bf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c6a66"/>
      <stop offset="1" stop-color="#55534f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5a3c"/>
      <stop offset="0.5" stop-color="#8d6a49"/>
      <stop offset="1" stop-color="#76563a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#wall)"/>
  <rect y="830" width="1600" height="10" fill="#b9bdb5"/>
  <rect y="840" width="1600" height="160" fill="url(#floor)"/>
  <!-- credenza: 250 cm wide -->
  <ellipse cx="800" cy="842" rx="430" ry="12" fill="#000" opacity="0.2"/>
  <rect x="400" y="540" width="800" height="260" fill="url(#wood)"/>
  <rect x="400" y="540" width="800" height="10" fill="#9a7853"/>
  <g stroke="#5e4329" stroke-width="3"><line x1="600" y1="555" x2="600" y2="795"/><line x1="800" y1="555" x2="800" y2="795"/><line x1="1000" y1="555" x2="1000" y2="795"/></g>
  <rect x="430" y="800" width="14" height="40" fill="#2a2a2a"/><rect x="1156" y="800" width="14" height="40" fill="#2a2a2a"/>
  <!-- objects on credenza -->
  <path d="M480 540 L492 440 L538 440 L550 540 Z" fill="#e8e4dc"/>
  <rect x="1020" y="505" width="110" height="35" fill="#2f2f2f"/><rect x="1030" y="480" width="95" height="25" fill="#bfb6a6"/>
  <!-- chair -->
  <path d="M1330 600 Q1330 560 1370 560 L1470 560 Q1510 560 1510 600 L1510 760 L1330 760 Z" fill="#3a3a3a"/>
  <rect x="1310" y="720" width="220" height="60" rx="18" fill="#444"/>
  <rect x="1338" y="780" width="10" height="60" fill="#222"/><rect x="1492" y="780" width="10" height="60" fill="#222"/>
</svg>
